<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Playground · Sijian Tian</title>
<style>
:root{
  --bg:#fdf6ee;--card:#fffaf4;--border:#f0d8c0;--line:#ecdcc6;
  --text:#2c1a0e;--text2:#6b3f20;--text3:#a0795a;
  --blue2:#60a5fa;--pink2:#f472b6;--orange:#f97316;--violet:#8b5cf6;--green:#22a660;
  --display:'Chalkboard SE','Hiragino Maru Gothic ProN','PingFang SC','Noto Sans SC',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Hiragino Sans','PingFang SC','Noto Sans SC','Noto Sans JP','Segoe UI',system-ui,sans-serif;
}
html[lang="ja"]{--display:'Chalkboard SE','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow-wrap:break-word}
button{font-family:inherit;color:inherit}
.rs{max-width:1220px;margin:0 auto;padding:22px 16px 32px}
.embed .rs{padding:4px 2px 8px}
.embed .topbar{display:none}

/* ---------- type scale ---------- */
.t-label{font:600 11.5px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:0}
.t-lead{font:400 13.5px/1.65 var(--body);color:var(--text2);margin:0}
.t-num{font:700 32px/1 var(--display);letter-spacing:-.01em}

.topbar{display:flex;justify-content:flex-end;margin-bottom:4px}
.lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:5px 12px;font-size:12.5px;cursor:pointer}
.lang button.on{background:var(--orange);color:#fff}

.intro{text-align:center;margin:0 0 18px}
.intro h1{font:700 clamp(26px,3.6vw,38px)/1.15 var(--display);color:var(--blue2);margin:6px 0 6px}
.intro .focus{font:600 clamp(16px,2vw,21px)/1.35 var(--display);margin:0}

/* ---------- mode tabs ---------- */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:11px;align-items:center;padding:11px 13px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);transition:border-color .2s,background .2s,transform .2s}
.mode:hover{transform:translateY(-2px)}
.mode:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.mode .n{font:700 25px/1 var(--display);color:var(--c)}
.mode .v{display:block;font:600 10.5px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.mode .nm{display:block;font:600 14px/1.3 var(--body);margin-top:3px}
.mode[data-i="0"]{--c:var(--blue2)}.mode[data-i="1"]{--c:var(--pink2)}.mode[data-i="2"]{--c:var(--orange)}.mode[data-i="3"]{--c:var(--violet);border-style:dashed}
.mode.on{border-color:var(--c);background:#fff;box-shadow:0 6px 18px rgba(160,121,90,.12)}
.question{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 2px 12px}
.question p{margin:0;font:500 15px/1.5 var(--body)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text2)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:14px}
.vp{position:relative;height:620px;border-radius:20px;overflow:hidden;border:1.5px solid var(--border);background:#f6f1e6}
.vp canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.labels{position:absolute;inset:0;pointer-events:none}
.vp-hint{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 150px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12px/1 var(--body);color:var(--text2);background:rgba(255,250,244,.92);border:1px solid var(--border);padding:7px 10px;border-radius:999px;pointer-events:none}
.vp-reset{position:absolute;right:12px;bottom:12px;font:600 12px/1 var(--body);background:rgba(255,250,244,.94);border:1px solid var(--border);padding:7px 11px;border-radius:999px;cursor:pointer}
.vp-msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--text2)}
.split{position:absolute;top:0;bottom:0;width:28px;margin-left:-14px;display:none;cursor:ew-resize;touch-action:none}
.split::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(44,26,14,.12)}
.split .knob{position:absolute;top:50%;left:0;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#fff;border:1.5px solid var(--border);font:700 12px/25px var(--body);text-align:center;color:var(--text2)}
.worldtag{position:absolute;top:12px;font:700 12px/1 var(--body);padding:7px 11px;border-radius:999px;background:rgba(255,250,244,.94);border:1px solid var(--border);display:none;pointer-events:none}
.worldtag.l{left:12px}.worldtag.r{right:12px;color:#be185d;border-color:#f9a8d4}
.vp.split-on .split,.vp.split-on .worldtag{display:block}
.panel{height:620px;overflow:auto;border-radius:20px;border:1.5px solid var(--border);background:var(--card);padding:18px 18px 16px}
.pane{display:none}
.pane.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane h3{font:700 19px/1.3 var(--display);margin:6px 0 6px}
.block{margin-top:16px}
.block>.t-label{margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}

/* shared controls */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;font:600 12.5px/1 var(--body);cursor:pointer}
.seg button.on{background:var(--text);color:#fff}
.btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font:600 12.5px/1 var(--body);cursor:pointer}
.btn:hover{background:#fff5e8}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.svgbox svg{display:block;width:100%;height:auto}
.quote{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font:400 13px/1.55 var(--body);color:var(--text2)}
.quote b{color:var(--text)}
.small{font:400 12px/1.5 var(--body);color:var(--text3);margin:10px 0 0}

/* persona chips */
.pchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.pchip{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:7px 4px 6px;text-align:center;background:#fff}
.pchip svg{width:34px;height:34px;display:block;margin:0 auto 3px}
.pchip span{display:block;font:600 11px/1.2 var(--body)}
.pchip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pchip .all{width:34px;height:34px;margin:0 auto 3px;border-radius:50%;background:conic-gradient(#a78bfa 0 25%,#fb7185 0 50%,#14b8a6 0 75%,#fb923c 0);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}

.clockrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.clockrow .t-num{min-width:92px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:13px;cursor:pointer;flex:none}
input[type=range]{flex:1;accent-color:var(--orange);min-width:60px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stats b{display:block;font:700 17px/1.1 var(--display)}
.stats span{font:500 11px/1.3 var(--body);color:var(--text3)}

/* stay chain */
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;transition:opacity .3s}
.chain li.stay{padding:7px 8px;border-radius:12px}
.chain li.trip{padding:0 8px;min-height:20px}
.chain .dot{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/24px var(--body);text-align:center;box-shadow:0 0 0 3px #fff}
.chain .vline{width:2px;height:20px;margin:0 auto;background:repeating-linear-gradient(var(--c) 0 3px,transparent 3px 6px)}
.chain .tt b{display:block;font:600 13px/1.25 var(--body)}
.chain .tt span{font:400 12px/1.3 var(--body);color:var(--text2)}
.chain .dur{font:600 12px/1 var(--body);color:var(--text2)}
.chain .tripl{font:400 11px/1 var(--body);color:var(--text3)}
.chain li.future{opacity:.32}
.chain li.now{background:#fff;box-shadow:0 0 0 1.5px var(--c) inset}

/* 02 */
.mchips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.mchip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.mchip i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.mchip b{display:block;font:600 12.5px/1.2 var(--body)}
.mchip span{display:block;font:400 11px/1.2 var(--body);color:var(--text3)}
.mchip.in{border-color:var(--c)}
.impact{width:100%;border-collapse:collapse;font:400 12.5px/1.35 var(--body)}
.impact td,.impact th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.impact th{font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.impact tr.sel td{background:#fff}
.impact tr{cursor:pointer}
.impact svg{width:26px;height:26px;display:block}
.impact .who b{display:block;font-weight:600}
.impact .who span{font-size:11.5px;color:var(--text3)}
.pos{color:#15803d;font-weight:700}.neg{color:#c2410c;font-weight:700}.zero{color:var(--text3)}

/* 03 */
.levers{display:grid;gap:7px}
.lever{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.lever b{display:block;font:600 13px/1.25 var(--body)}
.lever span{display:block;font:400 11.5px/1.3 var(--body);color:var(--text3)}
.lever .cost{font:600 11px/1 var(--body);color:var(--text2);white-space:nowrap}
.sw{width:34px;height:20px;border-radius:999px;background:#e7dccb;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.lever.on{border-color:var(--orange)}.lever.on .sw{background:var(--orange)}.lever.on .sw::after{left:16px}
.lever.blocked{opacity:.5}
.budgetbar{height:10px;border-radius:999px;background:#f1e7d8;overflow:hidden;margin-top:6px}
.budgetbar i{display:block;height:100%;background:var(--orange);transition:width .3s}
.warn{color:#c2410c;font:600 12px/1.4 var(--body);min-height:16px;margin-top:4px}
.insight{margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font:500 13px/1.55 var(--body)}

/* 04 */
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stamp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1.5px dashed var(--line);background:#fff;font:600 12.5px/1.25 var(--body)}
.stamp i{width:26px;height:26px;border-radius:50%;border:2px dashed var(--c);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:13px}
.stamp.got{border-style:solid;border-color:var(--c)}
.stamp.got i{background:var(--c);border-style:solid}
.gstatus{display:inline-block;font:600 12px/1 var(--body);padding:6px 10px;border-radius:999px;background:#f1e9df;color:var(--text2)}
.gstatus.crowd{background:#ffedd5;color:#c2410c}
.result{margin-top:12px;padding:11px 13px;border-radius:12px;font:500 13px/1.55 var(--body);display:none}
.result.ok{display:block;background:#dcfce7;color:#14532d}
.result.bad{display:block;background:#ffe4e6;color:#9f1239}

/* 3D labels */
.lab{font:600 11px/1 var(--body);color:var(--text2);background:rgba(255,250,244,.93);border:1px solid var(--border);padding:4px 7px;border-radius:999px;white-space:nowrap}
.lab.land{font-weight:500;color:var(--text3)}
.pinlab{font:700 11px/1 var(--body);color:#fff;background:var(--c);padding:4px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge{display:flex;align-items:center;gap:5px;font:600 11px/1 var(--body);background:#fff;border:1.5px solid var(--c);padding:3px 8px 3px 3px;border-radius:999px;white-space:nowrap}
.badge svg{width:20px;height:20px}
.zlab{font:700 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:#fff;border:1.5px solid var(--c);color:var(--c);white-space:nowrap}
.modlab{font:700 11px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.tick{font:600 10.5px/1 var(--body);color:var(--text2);background:rgba(255,250,244,.9);padding:2px 5px;border-radius:6px}

.note{font:400 12px/1.5 var(--body);color:var(--text3);margin:12px 4px 0;text-align:center}

@media (max-width:900px){
  .modes{grid-template-columns:repeat(2,1fr)}
  .stage{grid-template-columns:1fr}
  .vp{height:420px}
  .panel{height:auto;overflow:visible}
}
</style>

<body>
<div class="rs" id="app">
  <div class="topbar">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ja">日本語</button><button data-lang="zh">中文</button>
    </div>
  </div>
  <header class="intro">
    <p class="t-label" data-t="eyebrow"></p>
    <h1 data-t="vision"></h1>
    <p class="focus" data-t="focus"></p>
  </header>

  <nav class="modes" id="modes" role="tablist"></nav>
  <div class="question"><p id="question"></p><div class="kw" id="kw"></div></div>

  <div class="stage">
    <div class="vp" id="vp">
      <div class="labels" id="labels"></div>
      <span class="worldtag l" data-t="cur"></span><span class="worldtag r" data-t="what"></span>
      <div class="split" id="split"><span class="knob">⇆</span></div>
      <span class="vp-hint" id="hint"></span>
      <button class="vp-reset" id="resetView" data-t="resetView"></button>
      <div class="vp-msg" id="vpmsg" data-t="noWebgl"></div>
    </div>

    <aside class="panel">
      <!-- 01 -->
      <section class="pane" id="pane0">
        <p class="t-label" data-t="p0label"></p>
        <h3 data-t="p0h"></h3>
        <p class="t-lead" data-t="p0p"></p>
        <div class="pchips" id="pchips"></div>
        <div class="row"><div class="seg" id="view1"><button data-v="map"></button><button data-v="st"></button></div></div>
        <p class="quote" id="quote1"></p>
        <div class="clockrow">
          <span class="t-num" id="clock1">06:00</span>
          <button class="iconbtn" id="play1" aria-label="play">▶</button>
          <input type="range" id="slider1" min="6" max="24" step="0.02" value="6" aria-label="time of day">
        </div>
        <div id="detail1"></div>
      </section>
      <!-- 02 -->
      <section class="pane" id="pane1">
        <p class="t-label" data-t="p1label"></p>
        <h3 data-t="p1h"></h3>
        <p class="t-lead" data-t="p1p"></p>
        <div class="block"><p class="t-label" data-t="modsLabel"></p><div class="mchips" id="mchips"></div></div>
        <div class="block"><p class="t-label" data-t="impactLabel"></p><table class="impact" id="impact"></table></div>
        <div class="block"><p class="t-label" id="cmp2label"></p><div class="svgbox"><svg id="cmp2" viewBox="0 0 400 128"></svg></div></div>
        <div class="row"><button class="btn" id="resetMods"></button></div>
        <p class="small" data-t="method"></p>
      </section>
      <!-- 03 -->
      <section class="pane" id="pane2">
        <p class="t-label" data-t="p2label"></p>
        <h3 data-t="p2h"></h3>
        <p class="t-lead" data-t="p2p"></p>
        <div class="block"><div class="levers" id="levers"></div>
          <div class="row" style="margin-top:10px;justify-content:space-between"><span class="t-label" id="budgetText"></span></div>
          <div class="budgetbar"><i id="budgetFill"></i></div><div class="warn" id="warn3"></div></div>
        <div class="row"><div class="seg" id="view3"><button data-v="place"></button><button data-v="indiv"></button></div></div>
        <div class="block"><p class="t-label" id="res3label"></p><div class="svgbox"><svg id="res3" viewBox="0 0 400 260"></svg></div></div>
        <div class="insight" id="insight3"></div>
      </section>
      <!-- 04 -->
      <section class="pane" id="pane3">
        <p class="t-label" data-t="p3label"></p>
        <h3 data-t="p3h"></h3>
        <p class="t-lead" data-t="p3p"></p>
        <div class="row"><div class="seg" id="role"><button data-r="tourist"></button><button data-r="resident"></button></div></div>
        <p class="quote" id="mission"></p>
        <div class="clockrow"><span class="t-num" id="clock4">09:00</span><span class="small" id="deadline4" style="margin:0"></span></div>
        <div class="row"><span class="gstatus" id="gstatus"></span></div>
        <div class="block"><p class="t-label" data-t="stampsLabel"></p><div class="stamps" id="stamps"></div></div>
        <div class="result" id="result4"></div>
        <div class="row"><button class="btn" id="restart4"></button></div>
      </section>
    </aside>
  </div>
  <p class="note" data-t="note"></p>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* =================================================================== i18n */
const durFmt = (u1, u2, sep) => h => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)}${u1}${sep}${String(m % 60).padStart(2, '0')}${u2}` : `${m}${u2}`; };
const TXT = {
  en: {
    eyebrow: 'Research vision', vision: 'Sustainable and Equitable Cities', focus: 'Human-Centered Urban Mobility & Policy Simulation',
    modes: [
      {verb: 'Understand', name: 'Daily trajectories', q: 'How do people’s days move through the city, and why do they differ across lives and places?', kw: ['Behavioral patterns', 'Space-time paths']},

      {verb: 'Support', name: 'Policy sandbox', q: 'Which mix of policies helps whom, and which places win or lose?', kw: ['Place-based results', 'Individual-based results', 'Web applications']},

    resetView: 'Reset view', noWebgl: 'This interactive city needs WebGL. Please try a recent browser.',
    acts: {home: 'home', work: 'work', study: 'study', shop: 'shopping', leis: 'leisure', care: 'childcare'},
    places: {home: 'Home', daycare: 'Daycare (only one with a place)', supermarket: 'Supermarket', officeA: 'Office', park: 'Park & shrine', shotengai: 'Shopping street',
      juku: 'Cram school', cafe: 'Café (part-time job)', studio: 'Dance studio', konbini: 'Convenience store', school: 'High school',
      'mod:park': 'New pocket park', 'mod:daycare': 'New daycare', 'mod:studio': 'New dance studio', 'mod:cowork': 'New co-working café'},
    pers: {mom: 'Working mother', dancer: 'Street dancer', wfh: 'Remote worker', student: 'Student'},
    quotes: {mom: '“Daycare, office, groceries. The only daycare with a place is across town.”',
      dancer: '“I make coffee by day and dance by night, but the studio is on the other side of the city.”',
      wfh: '“My commute is ten steps. Some days I don’t leave home at all.”',
      student: '“School, then cram school. The konbini is my only third place.”'},
    all: 'All four', viewMap: 'Map', viewST: 'Space-time',
    p0label: '01 · Daily trajectories', p0h: 'How a day moves through the city',
    p0p: 'Choose a life theme and press play. Pins are stay points and arcs are trips. Switch to space-time to stack the day upward, with height as time of day.',
    stOut: 'Out of home', stTravel: 'Travelling', stPlaces: 'Places', leisure: 'Leisure',
    chainLabel: 'Stay-point timeline', cmpAll: 'Four days, side by side', clickRow: 'Click a row to follow that person.',

const matCache = new Map();
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({color, roughness: .85, metalness: 0, ...o}));
  return matCache.get(key);
}
const geoCache = new Map();
function rbox(w, h, d, r = .35) {
  const key = [w, h, d, r].join();
  if (!geoCache.has(key)) geoCache.set(key, new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - .01, h / 2 - .01, d / 2 - .01)));
  return geoCache.get(key);
}
function mesh(geo, m, x = 0, y = 0, z = 0, cast = true) {
  const me = new THREE.Mesh(geo, m);
  me.position.set(x, y, z);
  me.castShadow = cast;
  me.receiveShadow = true;
  return me;
}
function place(obj, x, z, rot = 0, parent = scene) { obj.position.set(x, obj.position.y, z); obj.rotation.y = rot; parent.add(obj); return obj; }

// window textures: a coloured map for daytime and an emissive map that lights up at night
function winTex(office, night) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = night ? '#000000' : '#ffffff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = night ? '#ffd27a' : office ? '#a9cbe8' : '#c3dcef';
  if (office) g.fillRect(6, 8, 52, 38); else g.fillRect(18, 14, 28, 32);
  if (!night) { g.fillStyle = 'rgba(255,255,255,.55)'; if (office) g.fillRect(6, 8, 52, 6); else g.fillRect(18, 14, 28, 6); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const TEX = {res: [winTex(false, false), winTex(false, true)], office: [winTex(true, false), winTex(true, true)]};
const GLOW = []; // materials whose emissive intensity follows the night factor
const GLASS = new THREE.MeshStandardMaterial({color: '#bfe0f5', emissive: '#ffd38a', emissiveIntensity: 0, roughness: .4});
GLOW.push(GLASS);
function facadeMats(color, kind, rx, ry) {
  const [d, n] = TEX[kind].map(t => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; });
  const side = new THREE.MeshStandardMaterial({color, map: d, emissive: '#ffd38a', emissiveMap: n, emissiveIntensity: 0, roughness: .85});
  GLOW.push(side);
  const top = mat(color);
  return [side, side, top, top, side, side];
}
function house(wall = '#fde7c8', roof = '#f28b6b', w = 5, d = 5, h = 3.4) {
  const g = new THREE.Group();
  g.add(mesh(rbox(w, h, d, .3), mat(wall), 0, h / 2, 0));
  const sh = new THREE.Shape();
  sh.moveTo(-w / 2 - .45, 0); sh.lineTo(w / 2 + .45, 0); sh.lineTo(0, 2.3); sh.closePath();
  const rg = new THREE.ExtrudeGeometry(sh, {depth: d + .6, bevelEnabled: true, bevelSize: .12, bevelThickness: .12, bevelSegments: 2});
  rg.translate(0, 0, -(d + .6) / 2);
  g.add(mesh(rg, mat(roof), 0, h - .05, 0));
  g.add(mesh(new THREE.BoxGeometry(1, 1.9, .12), mat('#b07a4f'), -1, .95, d / 2 + .02, false));
  g.add(mesh(new THREE.BoxGeometry(1.3, 1.1, .12), GLASS, 1.2, 2.1, d / 2 + .02, false));

}

function arcCurve(a, b, lift = 1) {
  const pa = new THREE.Vector3(a[0], .6, a[1]), pb = new THREE.Vector3(b[0], .6, b[1]);
  const mid = pa.clone().add(pb).multiplyScalar(.5);
  mid.y = (6 + pa.distanceTo(pb) * .22) * lift;
  return new THREE.QuadraticBezierCurve3(pa, mid, pb);
}

    $('#res3label').textContent = T().placeLabel;
    const rows = ZONES.map(k => [k, R.place[k]]).sort((a, b) => b[1] - a[1]);
    rows.forEach(([k, v], i) => {
      const y = 14 + i * 22, x0 = 250, w = Math.abs(v) * 3.6;
      s += `<text x="4" y="${y + 4}" font-size="11.5" fill="${INK}">${T().zones[k]}</text><line x1="${x0}" y1="${y - 8}" x2="${x0}" y2="${y + 8}" stroke="#e7dccb"/>`;
      s += `<rect x="${v >= 0 ? x0 : x0 - w}" y="${y - 6}" width="${w}" height="12" rx="4" fill="${v >= 0 ? '#22c55e' : '#f97316'}"/>`;
      s += `<text x="${v >= 0 ? x0 + w + 5 : x0 - w - 5}" y="${y + 4}" font-size="11" font-weight="700" text-anchor="${v >= 0 ? 'start' : 'end'}" fill="${v ? INK : '#a0795a'}">${v > 0 ? '+' : ''}${v}%</text>`;
    });
  } else {
    $('#res3label').textContent = T().indivLabel;
    const X = v => 150 + (v + 20) / 100 * 236;
    PERS.forEach((p, r) => {
      const y = 30 + r * 50;
      s += avatarAt(p, 16, y, 12) + `<text x="34" y="${y + 4}" font-size="11.5" font-weight="600" fill="${INK}">${T().pers[p]}</text><line x1="150" y1="${y}" x2="386" y2="${y}" stroke="#efe4d3"/>`;
      const R2 = rng(r + 11);
      s3.people.forEach((q, i) => { if (q.p === p) s += `<circle cx="${X(clamp(R.gains[i], -20, 80))}" cy="${y + (R2() - .5) * 26}" r="2.6" fill="${PC[p]}" fill-opacity=".8"/>`; });
    });
    s += `<line x1="${X(0)}" y1="8" x2="${X(0)}" y2="216" stroke="${INK}" stroke-width="1" stroke-dasharray="3 3"/>`;
    for (const v of [-20, 0, 20, 40, 60, 80]) s += `<text x="${X(v)}" y="232" text-anchor="middle" font-size="10" fill="#a0795a">${v > 0 ? '+' : ''}${v}</text>`;
    const n = R.gains.length, g15 = Math.round(R.gains.filter(g => g >= 15).length / n * 100), lo = Math.round(R.gains.filter(g => g < 0).length / n * 100);
    s += `<text x="150" y="254" font-size="11.5" font-weight="700" fill="#15803d">${T().gain15(g15)}</text><text x="386" y="254" text-anchor="end" font-size="11.5" font-weight="700" fill="#c2410c">${T().lose(lo)}</text>`;
  }
  $('#res3').innerHTML = s;
  let txt = T().ins0;
  if (R.any) {
    const who = PERS.reduce((a, b) => R.pers[a] >= R.pers[b] ? a : b);
    const zs = ZONES.slice().sort((a, b) => R.place[b] - R.place[a]), worst = zs[zs.length - 1];
    txt = T().insWho(T().pers[who]) + T().insWin(T().zones[zs[0]]) + (R.place[worst] < 0 ? T().insLose(T().zones[worst]) : (lang === 'en' ? '.' : '。'));
  }
  $('#insight3').textContent = txt;
}
document.querySelectorAll('#view3 button').forEach(b => b.onclick = () => { s3.view = b.dataset.v; renderPanel3(); });

/* =================================================================== 04 · exploration game */
const g4 = new THREE.Group(); scene.add(g4);
const GAME = {
  tourist: {start: [13, 6], clock: 9, deadline: 17, fig: 'tourist', stamps: [['tower', [-54, -28], .7, '#ef5a35'], ['skytree', [72, -11], .7, '#60a5fa'], ['shrine', [-40, -5], .4, '#e4572e'], ['shotengai', [-17, 1], .5, '#f59e0b']]},
  resident: {start: [13, -21], clock: 17, deadline: 19.5, fig: 'mom', stamps: [['daycare', [-40, 40.5], .15, '#f472b6'], ['supermarket', [-8, -22], .3, '#facc15'], ['park', [-44, 1], .35, '#22c55e'], ['home', [-47, -24], 0, '#a78bfa']]}};
const CROWD = [{c: [13, 0], r: 15}, {c: [-15, 0], r: 13}];
const s4 = {role: 'tourist', fig: null, markers: [], got: [], clock: 9, pos: [0, 0], target: null, walked: 0, done: false, failed: '', crowd: false, steps: null, nsteps: 0, lastStep: null};
function build4() {
  clearGroup(g4);
  const G = GAME[s4.role];
  s4.fig = figure(G.fig);
  if (s4.fig.userData.child) s4.fig.userData.child.visible = false;
  g4.add(s4.fig);
  s4.markers = G.stamps.map(([k, p, , c]) => {
    const g = new THREE.Group();
    const coin = mesh(new THREE.CylinderGeometry(2.4, 2.4, .5, 32), new THREE.MeshStandardMaterial({color: '#ffffff', emissive: c, emissiveIntensity: .1}), 0, 0, 0);
    coin.rotation.x = Math.PI / 2;
    g.add(coin);
    g.add(mesh(new THREE.TorusGeometry(2.4, .25, 8, 32), mat(c), 0, 0, 0));
    g.position.set(p[0], 9, p[1]);
    g4.add(g);
    const pole = mesh(new THREE.CylinderGeometry(.12, .12, 9, 6), mat(c), p[0], 4.5, p[1], false);
    g4.add(pole);
    const lab = label('', 'modlab', g, 0, 4, 0);
    lab.element.style.setProperty('--c', c);
    lab.name = 'stamp:' + k;
    return {k, g, coin, color: c};
  });
  s4.steps = new THREE.InstancedMesh(new THREE.CylinderGeometry(.45, .45, .1, 10), new THREE.MeshBasicMaterial({color: PC[G.fig]}), 700);
  s4.steps.count = 0;
  g4.add(s4.steps);
  for (const z of CROWD) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(z.r - .5, z.r, 48), new THREE.MeshBasicMaterial({color: '#f97316', transparent: true, opacity: .35, depthWrite: false}));
    ring.rotation.x = -Math.PI / 2; ring.position.set(z.c[0], .5, z.c[1]);
    g4.add(ring);
  }
  reset4();
}
function reset4() {
  const G = GAME[s4.role];
  Object.assign(s4, {got: [], clock: G.clock, pos: G.start.slice(), target: null, walked: 0, done: false, failed: '', crowd: false, nsteps: 0, lastStep: G.start.slice(), route: []});
  s4.steps.count = 0;
  if (s4.fig.userData.child) s4.fig.userData.child.visible = false;
  s4.fig.position.set(G.start[0], 0, G.start[1]);
  renderPanel4();
}
function crowdedAt(p, h) { return (h >= 8 && h <= 10 || h >= 17 && h <= 19.5) && CROWD.some(z => dist(p, z.c) < z.r); }
function update4(t, dt) {
  const G = GAME[s4.role];
  s4.markers.forEach((m, i) => {
    const got = s4.got.includes(m.k);
    m.g.rotation.y = got ? 0 : t * 1.6;
    m.coin.material.color.set(got ? m.color : '#ffffff');
    m.g.position.y = 9 + (got ? 0 : Math.sin(t * 2 + i) * .5);
  });
  let moving = false;
  if (s4.target && !s4.done && !s4.failed) {
    const d = dist(s4.pos, s4.target), crowd = crowdedAt(s4.pos, s4.clock), step = Math.min(d, dt * (crowd ? 12 : 26));
    if (crowd !== s4.crowd) { s4.crowd = crowd; renderStatus4(); }
    if (d > .2) {
      const ux = (s4.target[0] - s4.pos[0]) / d, uz = (s4.target[1] - s4.pos[1]) / d;
      s4.pos[0] += ux * step; s4.pos[1] += uz * step;
      s4.walked += step;
      s4.clock += step * .0075 * (crowd ? 2.2 : 1);
      s4.fig.rotation.y = Math.atan2(ux, uz);
      moving = true;
      if (dist(s4.pos, s4.lastStep) > 2.4 && s4.nsteps < 700) {
        const o = new THREE.Object3D();
        o.position.set(s4.pos[0], .25, s4.pos[1]); o.updateMatrix();
        s4.steps.setMatrixAt(s4.nsteps++, o.matrix); s4.steps.count = s4.nsteps; s4.steps.instanceMatrix.needsUpdate = true;
        s4.lastStep = s4.pos.slice();
      }
    } else { s4.target = null; renderStatus4(); }
    for (const [k, p, dwell] of G.stamps) {
      if (s4.got.includes(k) || dist(s4.pos, p) > 6) continue;
      if (k === 'home' && s4.got.length < G.stamps.length - 1) { if (!s4.warned) { s4.warned = true; showResult4(T().homeLast, 'bad', true); } continue; }
      if (k === 'daycare' && s4.clock > 18) { s4.failed = T().late; break; }
      s4.got.push(k); s4.route.push(T().stamps[k]); s4.clock += dwell; s4.target = null;
      if (k === 'daycare' && s4.fig.userData.child) s4.fig.userData.child.visible = true;
      if (s4.got.length === G.stamps.length) s4.done = true;
      renderPanel4();
    }
    if (s4.warned && dist(s4.pos, G.stamps[G.stamps.length - 1][1]) > 9) s4.warned = false;
    if (!s4.done && s4.clock > G.deadline) s4.failed = T().fail;
    if (s4.failed) renderPanel4();
    $('#clock4').textContent = fmt(s4.clock);
  }
  s4.fig.position.set(s4.pos[0], 0, s4.pos[1]);
  animateFigure(s4.fig, t, moving);
  setTimeOfDay(s4.clock);
}
function renderStatus4() {
  const el = $('#gstatus');
  el.className = 'gstatus' + (s4.crowd && s4.target ? ' crowd' : '');
  el.textContent = s4.crowd && s4.target ? T().crowded : s4.target ? T().walking : T().idle;
}
function showResult4(text, cls, transient) {
  const el = $('#result4');
  el.className = 'result ' + cls;
  el.textContent = text;
  if (transient) setTimeout(() => { if (!s4.done && !s4.failed) el.className = 'result'; }, 2200);
}
function renderPanel4() {
  const G = GAME[s4.role];
  document.querySelectorAll('#role button').forEach(b => { b.textContent = b.dataset.r === 'tourist' ? T().roleT : T().roleR; b.classList.toggle('on', b.dataset.r === s4.role); });
  $('#mission').textContent = s4.role === 'tourist' ? T().missionT : T().missionR;
  $('#clock4').textContent = fmt(s4.clock);
  $('#deadline4').textContent = T().deadline(fmt(G.deadline));
  $('#stamps').innerHTML = G.stamps.map(([k, , , c]) => `<div class="stamp${s4.got.includes(k) ? ' got' : ''}" style="--c:${c}"><i>${s4.got.includes(k) ? '✓' : ''}</i>${T().stamps[k]}</div>`).join('');
  $('#restart4').textContent = T().restart;
  s4.markers.forEach(m => { const l = m.g.children.find(o => o.isCSS2DObject); if (l) l.element.textContent = T().stamps[m.k]; });
  renderStatus4();
  if (s4.done) showResult4(T().done(fmt(s4.clock), Math.round(s4.walked * 25), s4.route.join(' → ')), 'ok');
  else if (s4.failed) showResult4(s4.failed, 'bad');
  else $('#result4').className = 'result';
}
document.querySelectorAll('#role button').forEach(b => b.onclick = () => { s4.role = b.dataset.r; build4(); });
$('#restart4').onclick = () => reset4();

/* =================================================================== modes, picking, language */
let mode = 0;
const GROUPS = [g1, g2, g3, g4];
const labelsVisible = (g, v) => g.traverse(o => { if (o.isCSS2DObject) o.visible = v; });
function renderModes() {
  $('#modes').innerHTML = T().modes.map((m, i) => `<button class="mode${i === mode ? ' on' : ''}" data-i="${i}" role="tab" aria-selected="${i === mode}"><span class="n">0${i + 1}</span><span><span class="v">${m.verb}</span><span class="nm">${m.name}</span></span></button>`).join('');
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(+b.dataset.i));
  $('#question').textContent = T().modes[mode].q;
  $('#kw').innerHTML = T().modes[mode].kw.map(k => `<span>${k}</span>`).join('');
  $('#hint').textContent = T().hint[mode];
}
function setMode(i) {
  mode = i;
  GROUPS.forEach((g, j) => { g.visible = j === i; labelsVisible(g, j === i); });
  document.querySelectorAll('.pane').forEach((p, j) => p.classList.toggle('on', j === i));
  vp.classList.toggle('split-on', i === 1);
  renderModes();
  if (i === 0) { s1.idx = -1; }
  if (i === 1) { setTimeOfDay(14); rebuild2(); }
  if (i === 2) { s3.res = null; renderPanel3(); }
  if (i === 3) renderPanel4();
  flyTo();
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function setRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function modAt(e) {
  setRay(e);
  const h = ray.intersectObjects(s2.mods.map(m => m.obj), true).find(x => x.object.userData.mod && !(x.object.geometry && x.object.geometry.type === 'RingGeometry'));
  return h ? s2.mods.find(m => m.type === h.object.userData.mod) : null;
}
function groundAt(e) { setRay(e); const p = new THREE.Vector3(); return ray.ray.intersectPlane(groundPlane, p) ? [p.x, p.z] : null; }
function onClick(e) {
  if (mode === 3 && !s4.done && !s4.failed) {
    setRay(e);
    const h = ray.intersectObjects(GROUND, false).find(x => x.face && x.face.normal.y > .5);
    if (h) { s4.target = [h.point.x, h.point.z]; renderStatus4(); }
  }
}
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.querySelectorAll('[data-t]').forEach(e => { if (typeof T()[e.dataset.t] === 'string') e.textContent = T()[e.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  scene.traverse(o => {
    if (!o.isCSS2DObject || !o.name) return;
    if (o.name.startsWith('land:')) o.element.textContent = T().land[o.name.slice(5)];
    if (o.name.startsWith('mod:')) o.element.textContent = T().mods[o.name.slice(4)];
  });
  renderModes(); renderPanel1(); if (mode === 1) rebuild2(); else renderPanel2(); renderPanel3(); renderPanel4();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; applyLang(); });
$('#resetView').onclick = () => flyTo();

/* =================================================================== boot */
buildCity(); buildMovers(); build1(); build2(); simulate2(); build3(); build4();
applyLang();
setMode(0);
flyTo(true);
setTimeOfDay(6);
if (controls) {
  controls.addEventListener('start', () => { tween = null; });
  const cv = renderer.domElement;
  let down = null;
  cv.addEventListener('pointerdown', e => {
    down = [e.clientX, e.clientY];
    if (mode === 1) {
      const m = modAt(e);
      if (m) { s2.drag = m; controls.enabled = false; cv.setPointerCapture(e.pointerId); }
    }
  });
  cv.addEventListener('pointermove', e => {
    if (s2.drag) {
      const p = groundAt(e);
      if (p) { moveMod(s2.drag, [clamp(p[0], -60, 44), clamp(p[1], -42, 66)]); s2.dirty = true; }
      return;
    }
    if (!e.buttons) cv.style.cursor = mode === 1 && modAt(e) ? 'grab' : mode === 3 ? 'pointer' : '';
  });
  cv.addEventListener('pointerup', e => {
    if (s2.drag) { s2.drag = null; controls.enabled = true; rebuild2(); }
    else if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) onClick(e);
    down = null;
  });
}
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(w, h, false);
  labelR.setSize(w, h);
}
new ResizeObserver(resize).observe(vp);
resize();

let visible = true, last = performance.now(), started = false;
new IntersectionObserver(es => es.forEach(e => {
  visible = e.isIntersecting;
  if (visible && !started) { started = true; s1.playing = true; setPlay1(); }
}), {threshold: .25}).observe(vp);
const clock = new THREE.Clock(), _v = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!visible || !renderer) return;
  const t = clock.getElapsedTime();
  updateMovers(t, dt);
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 1.2);
    const k = ease(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.k >= 1) tween = null;
  }
  if (mode === 0) {
    if (s1.playing) { s1.h = Math.min(24, s1.h + dt * .8); if (s1.h >= 24) { s1.playing = false; setPlay1(); } }
    update1(t);
  }
  if (mode === 1 && s2.dirty && now - s2.lastBuild > 90) { s2.dirty = false; s2.lastBuild = now; rebuild2(); }
  if (mode === 2) update3();
  if (mode === 3) update4(t, dt);
  controls.update();
  const W = renderer.domElement.clientWidth, H = renderer.domElement.clientHeight;
  if (mode === 1) {
    const sx = Math.round(W * s2.split);
    renderer.setScissorTest(true);
    g2new.visible = false; g2cur.visible = true;
    s2.mods.forEach(m => m.obj.visible = !onBoard(m.pos) || m === s2.drag);
    renderer.setScissor(0, 0, sx, H); renderer.render(scene, camera);
    g2new.visible = true; g2cur.visible = false;
    s2.mods.forEach(m => m.obj.visible = true);
    renderer.setScissor(sx, 0, W - sx, H); renderer.render(scene, camera);
    renderer.setScissorTest(false);
    for (const m of s2.mods) {
      _v.set(m.pos[0], 8, m.pos[1]).project(camera);
      m.lab.visible = !onBoard(m.pos) || (_v.x + 1) / 2 * W > sx || m === s2.drag;
      m.ring.visible = onBoard(m.pos) || m === s2.drag;
    }
  } else renderer.render(scene, camera);
  labelR.render(scene, camera);
}
requestAnimationFrame(frame);

/* =================================================================== embedding */
if (EMBED) {
  document.documentElement.classList.add('embed');
  addEventListener('message', e => {
    const l = e.data && e.data.researchPlaygroundLang;
    if (['en', 'zh', 'ja'].includes(l) && l !== lang) { lang = l; applyLang(); }
  });
}
if (parent !== window) new ResizeObserver(() => parent.postMessage({researchPlaygroundHeight: Math.ceil($('#app').getBoundingClientRect().height)}, '*')).observe($('#app'));
</script>
